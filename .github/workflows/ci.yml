name: Build & Upload Skill Packages
on:
  push:
    branches: [main]
    paths: ['skills/**']
  workflow_dispatch:
concurrency:
  group: skill-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      COS_PREFIX: timem/skills/standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cos-python-sdk-v5
      - run: python scripts/build-all.py
      - name: Package
        run: |
          for d in dist/standalone/*/; do
            skill_id=$(basename "$d")
            (cd dist/standalone && zip -r "${skill_id}.zip" "$skill_id")
          done
      - name: Upload
        run: |
          set -euo pipefail
          [ -n "${TENCENT_SECRET_ID:-}" ] || { echo "SKIP: no COS creds"; exit 0; }
          python3 <<'PYEOF'
import os, sys
from qcloud_cos import CosConfig, CosS3Client
cfg = CosConfig(Region=os.environ['TENCENT_COS_REGION'],
                SecretId=os.environ['TENCENT_SECRET_ID'],
                SecretKey=os.environ['TENCENT_SECRET_KEY'],
                Scheme='https')
client = CosS3Client(cfg)
bucket = os.environ['TENCENT_COS_BUCKET']
prefix = os.environ['COS_PREFIX']
for d in os.listdir('dist/standalone'):
    if not d.endswith('.zip'): continue
    skill_id = d[:-4]
    key = f'{prefix}/{skill_id}/{d}'
    client.upload_file(Bucket=bucket, Key=key, LocalFilePath=f'dist/standalone/{d}', EnableMD5=True)
    client.put_object_acl(Bucket=bucket, Key=key, ACL='public-read')
    print(f'✅ {key}')
PYEOF
