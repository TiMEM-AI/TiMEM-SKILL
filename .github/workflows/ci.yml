name: Test, Package & Publish TiMEM Skills

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'skills/**'
      - 'scripts/**'
      - 'install-all.sh'
      - 'install-all.ps1'
      - 'README.md'
      - 'README_zh.md'
      - 'LICENSE'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'skills/**'
      - 'scripts/**'
      - 'install-all.sh'
      - 'install-all.ps1'
      - 'README.md'
      - 'README_zh.md'
      - 'LICENSE'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: skill-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-installer:
    name: Windows installer regression tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pester 4
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1 -Force

      - name: Run PowerShell installer tests
        shell: powershell
        run: Invoke-Pester -Script .\tests -EnableExit

  build-packages:
    name: Build and verify release artifacts
    needs: test-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build standalone skill packages
        run: |
          set -euo pipefail
          python scripts/build-all.py
          for skill_dir in dist/standalone/*/; do
            test -f "${skill_dir}SKILL.md"
            skill_id=$(basename "${skill_dir}")
            (cd dist/standalone && zip -qr "${skill_id}.zip" "${skill_id}")
            unzip -t "dist/standalone/${skill_id}.zip" >/dev/null
            unzip -l "dist/standalone/${skill_id}.zip" | grep -q "${skill_id}/SKILL.md"
          done

      - name: Build and verify full release ZIP
        id: release
        run: |
          set -euo pipefail
          version=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD)
          version="${version#v}"
          bash scripts/build-release.sh --version "${version}"

          release_zip="dist/release/timem-skill-${version}.zip"
          test -f "${release_zip}"
          unzip -t "${release_zip}" >/dev/null
          unzip -l "${release_zip}" | grep -q 'timem-skill/install-all.ps1'
          unzip -l "${release_zip}" | grep -q 'timem-skill/install-all.sh'
          unzip -p "${release_zip}" timem-skill/install-all.ps1 | cmp -s install-all.ps1 -
          cp "${release_zip}" dist/release/timem-skill-latest.zip
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified packages as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: timem-skill-packages-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo '## Verified TiMEM Skill packages'
            echo ''
            echo "Release: timem-skill-${{ steps.release.outputs.version }}.zip"
            echo 'Alias: timem-skill-latest.zip'
            echo 'Standalone packages:'
            find dist/standalone -maxdepth 1 -name '*.zip' -printf '  - %f\n'
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-to-cos:
    name: Publish verified packages to COS
    needs: build-packages
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    env:
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      SKILL_COS_PREFIX: timem/skills/standalone
      RELEASE_COS_PREFIX: releases
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: timem-skill-packages-${{ github.sha }}
          path: dist

      - name: Install COS SDK
        run: pip install cos-python-sdk-v5

      - name: Upload standalone and release packages
        run: |
          set -euo pipefail
          : "${TENCENT_SECRET_ID:?TENCENT_SECRET_ID secret is required}"
          : "${TENCENT_SECRET_KEY:?TENCENT_SECRET_KEY secret is required}"
          : "${TENCENT_COS_BUCKET:?TENCENT_COS_BUCKET secret is required}"
          : "${TENCENT_COS_REGION:?TENCENT_COS_REGION secret is required}"
          test -f dist/release/timem-skill-latest.zip

          python3 - <<'PY'
          import os
          from pathlib import Path

          from qcloud_cos import CosConfig, CosS3Client

          config = CosConfig(
              Region=os.environ['TENCENT_COS_REGION'],
              SecretId=os.environ['TENCENT_SECRET_ID'],
              SecretKey=os.environ['TENCENT_SECRET_KEY'],
              Scheme='https',
          )
          client = CosS3Client(config)
          bucket = os.environ['TENCENT_COS_BUCKET']
          standalone_prefix = os.environ['SKILL_COS_PREFIX'].strip('/')
          release_prefix = os.environ['RELEASE_COS_PREFIX'].strip('/')

          uploads = []
          for archive in sorted(Path('dist/standalone').glob('*.zip')):
              skill_id = archive.stem
              uploads.append((archive, f'{standalone_prefix}/{skill_id}/{archive.name}'))
          for archive in sorted(Path('dist/release').glob('timem-skill-*.zip')):
              uploads.append((archive, f'{release_prefix}/{archive.name}'))

          if not uploads:
              raise SystemExit('No verified packages were found for COS upload.')

          for archive, key in uploads:
              client.upload_file(
                  Bucket=bucket,
                  Key=key,
                  LocalFilePath=str(archive),
                  EnableMD5=True,
              )
              client.put_object_acl(Bucket=bucket, Key=key, ACL='public-read')
              print(f'Uploaded {archive} to cos://{bucket}/{key}')
          PY

      - name: Publish summary
        run: |
          {
            echo '## COS publication complete'
            echo ''
            echo "Latest release: https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/releases/timem-skill-latest.zip"
            echo "Versioned release: https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/releases/"
          } >> "${GITHUB_STEP_SUMMARY}"
