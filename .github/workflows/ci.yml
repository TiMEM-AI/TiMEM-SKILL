name: Test, Package & Publish TiMEM Skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'skills/**'
      - 'scripts/**'
      - 'install-all.sh'
      - 'install-all.ps1'
      - 'README.md'
      - 'README_zh.md'
      - 'LICENSE'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'skills/**'
      - 'scripts/**'
      - 'install-all.sh'
      - 'install-all.ps1'
      - 'README.md'
      - 'README_zh.md'
      - 'LICENSE'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: skill-ci-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  # Do not interrupt an in-flight publication after version objects have begun
  # uploading. Pull requests use distinct refs, so they still do not overlap.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-installer:
    name: Windows installer regression tests
    # The integration suite invokes Windows PowerShell 5.1 and verifies the
    # BOM-safe advertised bootstrap. A repository variable can select a
    # self-hosted Windows runner; otherwise GitHub-hosted Windows is used.
    runs-on: ${{ vars.RUNNER_LABEL_WINDOWS || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows COS download tests
        run: python -m unittest tests.test_cos_installer
      - name: Install Pester 3
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '3.4.0')) {
            Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force
      - name: Run PowerShell installer tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          Invoke-Pester -Script .\tests -EnableExit

  test-shell-installer:
    name: Bash installer regression tests
    # 设置仓库变量 RUNNER_LABEL_LINUX（如 runner-debian-13）可切换到自建/镜像 runner，
    # 未设置时 || 才会真正回退到 ubuntu-latest。
    runs-on: ${{ vars.RUNNER_LABEL_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      - name: Run COS artifact contract tests
        run: python -m unittest tests.test_cos_artifacts tests.test_cos_upload_plan tests.test_cos_installer
      - name: Run Bash installer tests
        run: bash tests/install-all.sh.Tests.sh

  build-packages:
    name: Build, verify and publish release artifacts
    needs: [test-installer, test-shell-installer]
    runs-on: ${{ vars.RUNNER_LABEL_LINUX || 'ubuntu-latest' }}
    # 构建与发布合并在同一个 job 内：自建 runner 的 artifact 中转服务不可用（ECONNREFUSED），
    # 不再依赖 upload/download-artifact，产物直接留在当前工作目录内发布。
    # 发布步骤仅在 push 到 main 或手动触发时执行，PR 只做构建验证。
    env:
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      COS_PREFIX: timem/skills/standalone
      COS_FULL_PREFIX: timem/skills/full/timem-memory-skill
      RELEASE_COS_PREFIX: releases
      INSTALLER_COS_PREFIX: installers
      # 飞书机器人 webhook 存于仓库 Secret（仓库设置 → Secrets），不要硬编码到工作流里。
      # webhook URL 等同于凭证，泄露后任何人都能往群里发消息；若曾明文提交过，需在飞书群设置里重新生成。
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      - name: Build standalone skill packages
        run: |
          set -euo pipefail
          python scripts/build-all.py
          for skill_dir in dist/standalone/*/; do
            test -f "${skill_dir}SKILL.md"
            skill_id=$(basename "${skill_dir}")
            (cd dist/standalone && zip -qr "${skill_id}.zip" "${skill_id}")
            unzip -t "dist/standalone/${skill_id}.zip" >/dev/null
            # 不用 grep -q：它匹配后立即关闭管道，会让 unzip 收到 SIGPIPE，
            # 在 set -o pipefail 下导致步骤以 141 失败。去掉 -q 让 grep 读完整个列表。
            unzip -l "dist/standalone/${skill_id}.zip" | grep "${skill_id}/SKILL.md" >/dev/null
          done
      - name: Build and verify full release ZIP
        id: release
        run: |
          set -euo pipefail
          version=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short=12 HEAD)
          version="${version#v}"
          bash scripts/build-release.sh --version "${version}"
          release_zip="dist/release/timem-skill-${version}.zip"
          test -f "${release_zip}"
          unzip -t "${release_zip}" >/dev/null
          # 注意：此处不能用 grep -q，否则 grep 提前退出会让 unzip 收到 SIGPIPE，
          # 在 set -o pipefail 下使步骤以退出码 141 失败。
          unzip -l "${release_zip}" | grep 'timem-skill/install-all.ps1' >/dev/null
          unzip -l "${release_zip}" | grep 'timem-skill/install-all.sh' >/dev/null
          unzip -l "${release_zip}" | grep 'timem-skill/dist/full/timem-memory-skill/SKILL.md' >/dev/null
          unzip -l "${release_zip}" | grep 'timem-skill/dist/standalone/timem-coding-memory/SKILL.md' >/dev/null
          unzip -l "${release_zip}" | grep 'timem-skill/dist/standalone/timem-general-memory/SKILL.md' >/dev/null
          unzip -l "${release_zip}" | grep 'timem-skill/skills/timem-writing-memory/SKILL.md' >/dev/null
          unzip -p "${release_zip}" timem-skill/install-all.ps1 | cmp -s install-all.ps1 -
          unzip -p "${release_zip}" timem-skill/install-all.sh | cmp -s install-all.sh -
          cp "${release_zip}" dist/release/timem-skill-latest.zip
          python scripts/build_cos_artifacts.py \
            --version "${version}" \
            --release-zip "${release_zip}"
          full_zip="dist/cos/full/timem-memory-skill-${version}.zip"
          unzip -t "${full_zip}" >/dev/null
          unzip -l "${full_zip}" | grep 'timem-memory-skill/SKILL.md' >/dev/null
          cmp -s install-all.ps1 "dist/cos/installers/${version}/install-all.ps1"
          cmp -s install-all.sh "dist/cos/installers/${version}/install-all.sh"
          python scripts/upload_cos.py --plan >/dev/null
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Install COS SDK
        if: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'workflow_dispatch'
          }}

        # 使用腾讯云 PyPI 镜像（自建 runner 在腾讯云内可走内网，避免官方源慢）
        run: pip install -i https://mirrors.cloud.tencent.com/pypi/simple cos-python-sdk-v5
      - name: Upload verified COS release snapshot
        if: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'workflow_dispatch'
          }}

        run: |
          set -euo pipefail
          : "${TENCENT_SECRET_ID:?TENCENT_SECRET_ID secret is required}"
          : "${TENCENT_SECRET_KEY:?TENCENT_SECRET_KEY secret is required}"
          : "${TENCENT_COS_BUCKET:?TENCENT_COS_BUCKET secret is required}"
          : "${TENCENT_COS_REGION:?TENCENT_COS_REGION secret is required}"
          python3 scripts/upload_cos.py
          python3 scripts/verify_cos_public.py --version '${{ steps.release.outputs.version }}'
      - name: Notify Feishu
        if: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'workflow_dispatch'
          }}

        # 发布到 COS 后发送飞书群通知；未配置 FEISHU_WEBHOOK secret 时自动跳过。
        # 通知失败不影响发布结果（尾部 || true），但会打印失败原因便于排查。
        run: |
          set -euo pipefail
          if [[ -z "${FEISHU_WEBHOOK}" ]]; then
            echo "未配置 FEISHU_WEBHOOK secret，跳过飞书通知"
            exit 0
          fi
          json_data='{"msg_type":"text","content":{"text":"'"TiMEM-SKILL:${GITHUB_SHA:0:7} 发布完成(${GITHUB_ACTOR})"'"}}'
          notify_response=$(curl -sS --max-time 10 \
            -X POST -H "Content-Type: application/json" \
            -d "$json_data" "${FEISHU_WEBHOOK}" 2>&1 || true)
          # 兼容飞书新旧两种返回格式："StatusCode":0 / "code":0
          if echo "$notify_response" | grep -Eq '"(StatusCode|code)":[[:space:]]*0'; then
            echo "飞书机器人消息发送成功"
          else
            echo "飞书机器人消息发送失败: ${notify_response}" || true
          fi
